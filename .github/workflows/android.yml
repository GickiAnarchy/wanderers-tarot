name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    if: contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Caching Magic ----------
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('buildozer.spec') }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev zip unzip \
            libncurses5 libtinfo5 libstdc++6

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build with Buildozer
        run: |
          # 1. Pre-create the license directory to prevent the 'Aidl' crash
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # 2. Manually inject the license hashes for Android SDK (standard hashes)
          # This tells the installer that the licenses are already accepted.
          echo -e "89334346ad57599a382335a8f2910f002871651d\nd562471b270fd2172776092b614d93375836214f\n24333f8a63b6825a1f5580547076840786015694" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504663158c582f123da6718d726615b6d9202755" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

          # 3. Force Buildozer to use a STABLE version to avoid the 37-rc1 bug
          # We do this by passing the versions as environment variables
          export APP_ANDROID_SDK=34
          export APP_ANDROID_API=34
          export APP_ANDROID_BUILD_TOOLS_VERSION=34.0.0
          
          # 4. Run the build
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalOracle-APK
          path: bin/*.apk
