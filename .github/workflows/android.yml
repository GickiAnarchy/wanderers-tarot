name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    if: contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Caching Magic ----------
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('buildozer.spec') }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev zip unzip \
            libncurses5 libtinfo5 libstdc++6

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build with Buildozer
        run: |
          # 1. Trigger initial download so paths exist
          buildozer android status || true

          # 2. Fix the cmdline-tools structure if necessary
          # Newer SDKs expect tools to be in cmdline-tools/latest/
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools" ] && [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
            mv $ANDROID_SDK_ROOT/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ 2>/dev/null || true
          fi

          # 3. Locate the sdkmanager regardless of where it's buried
          SDK_MANAGER=$(find $HOME/.buildozer -name "sdkmanager" | head -n 1)

          # 4. Manually accept all licenses to allow 'aidl' installation
          if [ -n "$SDK_MANAGER" ]; then
            echo "Found sdkmanager at $SDK_MANAGER. Accepting licenses..."
            yes | $SDK_MANAGER --sdk_root=$ANDROID_SDK_ROOT --licenses || true
          else
            echo "Error: sdkmanager not found. Creating manual license files..."
            mkdir -p $ANDROID_SDK_ROOT/licenses
            echo -e "89334346ad57599a382335a8f2910f002871651d\nd562471b270fd2172776092b614d93375836214f" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          fi

          # 5. Run the actual build
          buildozer android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalOracle-APK
          path: bin/*.apk
