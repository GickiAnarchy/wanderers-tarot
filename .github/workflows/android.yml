name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    if: contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Caching Magic ----------
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('buildozer.spec') }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev zip unzip \
            libncurses5 libtinfo5 libstdc++6

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython


      - name: Build with Buildozer
        run: |
          # 1. Trigger SDK/NDK download without a full build
          buildozer android status || true

          # 2. Find the sdkmanager and accept licenses
          # This fixes the "Aidl not found" by allowing build-tools to install
          SDK_MANAGER=$(find $HOME/.buildozer -name "sdkmanager" | head -n 1)
          
          if [ -n "$SDK_MANAGER" ]; then
            echo "Found sdkmanager at $SDK_MANAGER. Accepting licenses..."
            yes | $SDK_MANAGER --licenses || true
          else
            echo "Warning: sdkmanager not found. Buildozer might handle it, or the build may fail."
          fi

          # 3. Proceed with the actual APK generation
          buildozer android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalOracle-APK
          path: bin/*.apk
