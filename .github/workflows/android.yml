name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    if: contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Caching Magic ----------
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('buildozer.spec') }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev zip unzip \
            libncurses5 libtinfo5 libstdc++6

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          # Install a newer Cython version compatible with Python 3.11
          pip install 'cython>=0.29.36' buildozer

      - name: Build with Buildozer
        run: |
          # 1. Manually download and set up the stable Command Line Tools
          # This bypasses the "sdkmanager not found" error
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          # Download a stable version of cmdline-tools
          curl -C - -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
          
          # 2. Set the path so Buildozer and the system can find the new sdkmanager
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          
          # 3. Explicitly accept all licenses
          # This allows 'build-tools' (and aidl) to install without interruption
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true
          
          # 4. Create the legacy path Buildozer expects as a symlink 
          # This "tricks" Buildozer into finding the tool where it's looking
          mkdir -p $ANDROID_SDK_ROOT/tools/bin
          ln -s $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager

          # 5. Run the actual build
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalOracle-APK
          path: bin/*.apk